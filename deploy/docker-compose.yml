name: beautyads

services:
  postgres:
    image: postgres:17.11
    container_name: beautyads-postgres
    environment:
      POSTGRES_USER: beautyads
      POSTGRES_DB: beautyads
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD가 .env에 필요하다}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - beautyads_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "beautyads", "-d", "beautyads"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:2026.10.1-community
    container_name: beautyads-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD가 .env에 필요하다(8자 이상)}
    ports:
      - "127.0.0.1:7475:7474"
      - "127.0.0.1:7688:7687"
    volumes:
      - beautyads_neo4j_data:/data

volumes:
  beautyads_pgdata:
    name: beautyads_pgdata
  beautyads_neo4j_data:
    name: beautyads_neo4j_data
