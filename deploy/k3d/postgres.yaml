apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: beautyads
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: beautyads
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17.11
          env:
            - name: POSTGRES_USER
              value: beautyads
            - name: POSTGRES_DB
              value: beautyads
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: beautyads-env
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: [pg_isready, -U, beautyads, -d, beautyads]
            periodSeconds: 5
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: pgdata
        namespace: beautyads
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
