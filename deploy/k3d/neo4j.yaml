apiVersion: v1
kind: Service
metadata:
  name: neo4j
  namespace: beautyads
spec:
  selector:
    app: neo4j
  ports:
    - name: bolt
      port: 7687
      targetPort: 7687
    - name: http
      port: 7474
      targetPort: 7474
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neo4j
  namespace: beautyads
spec:
  serviceName: neo4j
  replicas: 1
  selector:
    matchLabels:
      app: neo4j
  template:
    metadata:
      labels:
        app: neo4j
    spec:
      containers:
        - name: neo4j
          image: neo4j:2026.10.1-community
          command: [/bin/sh, -c]
          args:
            - 'export NEO4J_AUTH="neo4j/${NEO4J_PASSWORD}"; exec /startup/docker-entrypoint.sh neo4j'
          env:
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: beautyads-env
                  key: NEO4J_PASSWORD
          ports:
            - containerPort: 7687
            - containerPort: 7474
          readinessProbe:
            tcpSocket:
              port: 7687
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: neo4jdata
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: neo4jdata
        namespace: beautyads
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
