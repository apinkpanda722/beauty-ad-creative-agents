# 브랜드별 공식몰 상품 이름 목록 (2026-11-15 수집)
# 별칭이 같은 브랜드의 둘 이상의 제품과 일치하면 모호하므로 버리는 규칙(derive_aliases)이 쓰는 비교 대상이다.
# 출처: 공식몰 12곳의 카테고리·전체 목록 페이지(robots.txt 허용 경로, 호스트당 14초 이상 간격). 대표 단품 선정 71개와 목록에서 확인한 제품을 모두 포함한다.
# 세트·기획·증정·N+1·키트·이벤트·샘플·듀오·트래블 같은 묶음 상품은 구성 제품 이름을 포함해 거짓 모호를 만들므로 뺐다.
# 목록을 끝까지 보지 못한 몰이 있어 이 목록은 브랜드 상품 전체가 아닐 수 있다. 값은 이름뿐이다(가격·URL 없음).
