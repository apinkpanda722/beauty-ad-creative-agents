# TikTok 광고주 이름 -> 집행 주체 분류 (CQ-09 입력, 2026-11-15)
# 대상: 훅·전체 분석 결과(hook@v1·full@v1 완료)가 있는 TikTok 소재의 광고주 44곳. 목록에 없는 이름은 unknown으로 읽는다.
# source: user = 사용자가 채팅으로 분류, rule = 이름에 브랜드 이름 또는 config/retailers.yaml 판매처 시드가 들어 있거나 숫자 ID·이름 없음(판단 불가)이라 규칙으로 채움.
# 기억이나 추정으로 분류를 추가하지 않는다. 이름은 strip·NFKC·소문자 정규화로 비교한다(DB의 이름 뒤 공백 등을 흡수).
# creatives는 분류 시점의 소재 수(참고용)이며 판정에 쓰지 않는다.
# CQ-09는 brand_direct·retailer 중 한쪽의 소재 수가 30건 미만이면 표본 부족으로 방향만 제시한다(docs/COMPETENCY_QUESTIONS.md).
