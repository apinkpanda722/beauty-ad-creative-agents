[project]
name = "beautyads"
version = "0.1.0"
description = "뷰티 광고 크리에이티브를 분석해 근거가 달린 기획안을 만드는 멀티에이전트 프로젝트"
readme = "README.md"
authors = [
    { name = "Tommy Lee", email = "iih907@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.3",
]

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.4",
]

[tool.uv]
# Homebrew·python.org 파이썬이 잡히지 않도록 uv 관리 파이썬만 쓴다 (docs/CONTRACTS.md의 로컬 환경 절).
python-preference = "only-managed"

[tool.ruff]
# 하네스(scripts)·phase 산출물(phases)·웹(web)은 린트 대상이 아니다.
extend-exclude = ["phases", "scripts", "web"]

[tool.pytest.ini_options]
testpaths = ["tests", "scripts"]
addopts = "-n auto"
timeout = 120
timeout_method = "thread"
